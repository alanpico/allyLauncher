<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Alan Games Launcher</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="top-bar">
        <div class="brand">Alan Games Launcher</div>
        <nav id="category-bar" class="category-bar" aria-label="Categories"></nav>
        <div class="top-actions">
          <button type="button" id="btn-open-folder" class="icon-btn" title="Open games folder">Folder</button>
          <button type="button" id="btn-settings" class="icon-btn" title="Settings">Settings</button>
        </div>
      </header>

      <main id="game-grid" class="game-grid" tabindex="0" aria-label="Games"></main>

      <p id="empty-state" class="empty-state hidden">
        Drop <code>.lnk</code> or <code>.url</code> shortcuts into your games folder.
      </p>
    </div>

    <dialog id="settings-dialog" class="settings-dialog">
      <form method="dialog" id="settings-form" class="settings-form">
        <h2>Settings</h2>

        <label class="field">
          <span>Games folder</span>
          <input id="settings-games-folder" type="text" autocomplete="off" />
        </label>

        <label class="field checkbox-field">
          <input id="settings-startup" type="checkbox" />
          <span>Launch with Windows</span>
        </label>

        <label class="field">
          <span>SteamGridDB API key</span>
          <input id="settings-api-key" type="password" autocomplete="off" placeholder="Stored locally only" />
        </label>

        <label class="field">
          <span>Theme</span>
          <select id="settings-theme"></select>
        </label>

        <div class="settings-actions">
          <button type="button" id="btn-open-themes" class="icon-btn">Open themes folder</button>
          <button type="button" id="btn-fetch-covers" class="icon-btn">Refresh covers</button>
          <button type="submit" value="save" class="primary-btn">Save</button>
          <button type="submit" value="cancel" class="icon-btn">Close</button>
        </div>

        <p class="hint">
          Gamepad: D-pad navigate · A launch · Y favorite · LB/RB categories · Start settings · B back
        </p>
      </form>
    </dialog>
  </body>
</html>
